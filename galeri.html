<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0709" />
    <meta name="description" content="Lorong kenangan BHARASENA — dokumentasi foto selama perayaan." />
    <title>Galeri BHARASENA 2026 | Batalyon Bhara Arsa Nawasena</title>
    <link rel="canonical" href="https://www.bharasena.com/galeri" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BHARASENA" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Galeri BHARASENA 2026" />
    <meta property="og:description" content="Lorong kenangan BHARASENA — dokumentasi foto selama perayaan." />
    <meta property="og:url" content="https://www.bharasena.com/galeri" />
    <meta property="og:image" content="https://www.bharasena.com/assets/bharasena-logo.png" />
    <meta property="og:image:alt" content="Lambang BHARASENA" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="gallery-page.css" />
    <script type="module" src="src/scripts/gallery-page.js"></script>
  </head>
  <body class="gallery-page">
    <a class="skip-link" href="#gallery-main">Lewati ke galeri</a>
    <div class="velvet-grain" aria-hidden="true"></div>
    <div class="ambient" aria-hidden="true"></div>

    <header class="gallery-header">
      <a class="site-brand" href="/" aria-label="BHARASENA, kembali ke awal">BHARASENA <span>· 2026</span></a>
      <a class="gallery-back action-link" href="/#galeri">Kembali ke acara</a>
    </header>

    <main id="gallery-main">
      <section class="gallery-hero" aria-labelledby="gallery-page-title">
        <div class="gallery-hero__ornament" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1 id="gallery-page-title">Galeri <em>foto.</em></h1>
        <p class="gallery-hero__intro">Dokumentasi BHARASENA · 11–13 Desember 2026</p>
      </section>

      <section class="gallery-room" aria-label="Foto dokumentasi">
        <div class="gallery-toolbar" hidden>
          <div class="gallery-filters" role="group" aria-label="Saring foto berdasarkan hari" data-gallery-filters>
            <button type="button" class="gallery-filter is-active" data-gallery-filter="all" aria-pressed="true">Semua foto</button>
          </div>
          <span class="gallery-toolbar__hint">Tekan foto untuk memperbesar</span>
        </div>
        <p class="gallery-room__note" data-gallery-status role="status">Memuat foto…</p>
        <div class="gallery-grid" data-gallery-grid></div>
        <noscript><p>Aktifkan JavaScript untuk melihat foto galeri.</p></noscript>
      </section>
    </main>

    <footer class="gallery-footer"><span>BHARASENA © 2026</span><span>Batalyon Bhara Arsa Nawasena</span></footer>

    <dialog class="gallery-lightbox" data-gallery-dialog aria-label="Foto dokumentasi BHARASENA">
      <button class="gallery-lightbox__close" type="button" data-gallery-close aria-label="Tutup foto" autofocus>×</button>
      <div class="gallery-lightbox__stage">
        <button class="gallery-lightbox__arrow gallery-lightbox__arrow--prev" type="button" data-gallery-prev aria-label="Foto sebelumnya">←</button>
        <figure>
          <img data-gallery-dialog-image alt="" />
          <figcaption><span data-gallery-dialog-caption></span><span data-gallery-dialog-counter></span></figcaption>
        </figure>
        <button class="gallery-lightbox__arrow gallery-lightbox__arrow--next" type="button" data-gallery-next aria-label="Foto berikutnya">→</button>
      </div>
    </dialog>
  </body>
</html>
